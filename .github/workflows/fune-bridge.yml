name: Fune bridge smoke

on:
  push:
    branches:
      - main
      - integration/fune-core-main
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Syntax check bridge integration
        run: |
          lua5.4 -e "assert(loadfile('Source/FuneBridge.lua'))"
          lua5.4 -e "assert(loadfile('Source/Music.lua'))"
      - name: Legacy Music smoke test without FuneCore
        run: lua5.4 tests/music_smoke.lua
      - name: Bridge smoke test
        run: lua5.4 tests/funebridge_smoke.lua
      - name: Music takeover smoke test with injected FuneCore
        run: lua5.4 tests/music_fune_smoke.lua
